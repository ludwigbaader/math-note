[package]
name = "math-note"
version = "0.1.0"
description = "A local notes app that evaluates the maths you write"
edition = "2021"
rust-version = "1.77"

[lib]
name = "math_note_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
